apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notebook
  template:
    metadata:
      labels:
        app: notebook
    spec:
      containers:
        - name: notebook
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /notebook/visitors.log; sleep 5; done"]
          volumeMounts:
            - name: locker
              mountPath: /notebook
      volumes:
        - name: locker
          persistentVolumeClaim:
            claimName: notebook-locker
