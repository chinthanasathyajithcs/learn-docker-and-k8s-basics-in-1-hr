apiVersion: apps/v1
kind: Deployment
metadata:
  name: stall-sign
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stall-sign
  template:
    metadata:
      labels:
        app: stall-sign
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          projected:
            sources:
              - configMap:
                  name: sign-html
              - configMap:
                  name: sign-logo
                  items:
                    - key: burger.png
                      path: logos/burger.png
---
apiVersion: v1
kind: Service
metadata:
  name: stall-sign
spec:
  type: NodePort
  selector:
    app: stall-sign
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
