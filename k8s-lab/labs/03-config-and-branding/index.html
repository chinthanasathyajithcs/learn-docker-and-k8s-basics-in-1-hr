<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sam's Burger Stall</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fff; color: #111;
           display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .logo { margin-bottom: 32px; }
    .logo img { height: 128px; border-radius: 16px; }
    h1 { font-weight: 300; margin: 0 0 8px; }
    p { color: #555; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/logos/burger.png" alt="" onerror="this.remove()">
  </div>
  <h1>Sam's Burger Stall</h1>
  <p>Served by nginx. The page and the logo come from ConfigMaps.</p>
</body>
</html>
