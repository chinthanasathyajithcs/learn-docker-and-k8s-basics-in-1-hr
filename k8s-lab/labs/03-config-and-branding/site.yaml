apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          projected:
            sources:
              - configMap:
                  name: site-html
              - configMap:
                  name: site-logos
                  items:
                    - key: ifs.png
                      path: logos/ifs.png
                    - key: nsbm.png
                      path: logos/nsbm.png
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  type: NodePort
  selector:
    app: site
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
