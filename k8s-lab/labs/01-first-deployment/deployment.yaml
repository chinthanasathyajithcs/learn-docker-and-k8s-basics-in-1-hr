apiVersion: apps/v1
kind: Deployment
metadata:
  name: stall
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stall
  template:
    metadata:
      labels:
        app: stall
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
