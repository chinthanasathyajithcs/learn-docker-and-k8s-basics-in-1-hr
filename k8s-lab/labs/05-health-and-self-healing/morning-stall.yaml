apiVersion: apps/v1
kind: Deployment
metadata:
  name: morning-stall
spec:
  replicas: 3
  selector:
    matchLabels:
      app: morning-stall
  template:
    metadata:
      labels:
        app: morning-stall
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: morning-stall
spec:
  selector:
    app: morning-stall
  ports:
    - port: 80
