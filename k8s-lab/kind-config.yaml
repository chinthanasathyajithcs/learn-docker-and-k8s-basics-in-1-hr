kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # NodePort used in lab 02
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081   # NodePort used in lab 03
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
