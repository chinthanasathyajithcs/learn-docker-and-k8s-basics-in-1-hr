services:
  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  logstash:
    image: logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "12201:12201/udp"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9600'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  kibana:
    image: kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: nsbm-classroom-demo-encryption-key
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ifs
      POSTGRES_PASSWORD: ifs
      POSTGRES_DB: ifsdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifs -d ifsdb"]
      interval: 10s
      timeout: 3s
      retries: 5

  mq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # RabbitMQ Management UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: "dev"
      DB_HOST: db
      DB_USER: ifs
      DB_PASS: ifs
      DB_NAME: ifsdb
      RMQ_HOST: mq
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
      logstash:
        condition: service_healthy
    ports:
      - "9000:9000"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "nsbm-api"
