services:
  cabinet:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: sam
      POSTGRES_DB: stall
    ports:
      - "5433:5432"
    volumes:
      - cabinet-papers:/var/lib/postgresql/data   # named volume: orders survive "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam -d stall"]
      interval: 10s
      timeout: 3s
      retries: 5

  bell:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # RabbitMQ Management UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cashier:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: "dev"
      DB_HOST: cabinet
      DB_USER: sam
      DB_PASS: sam
      DB_NAME: stall
      RMQ_HOST: bell
    depends_on:
      cabinet:
        condition: service_healthy
      bell:
        condition: service_healthy
    ports:
      - "9000:9000"

  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "notebook.py"]   # same recipe as the cashier, a different job
    environment:
      RMQ_HOST: bell
    depends_on:
      bell:
        condition: service_healthy
    restart: on-failure
    volumes:
      - notebook-pages:/notebook          # named volume: the notebook survives "docker compose down"
    healthcheck:
      test: ["CMD", "test", "-f", "/notebook/orders.log"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cabinet-papers:
  notebook-pages:
